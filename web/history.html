<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NutriTrack - Meal History</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Poppins', 'Segoe UI', Arial, sans-serif; background: #f8fafc; color: #1e293b; min-height: 100vh; }
        .header { background: linear-gradient(110deg, #1e40af, #2563eb); color: white; padding: 22px clamp(20px, 4vw, 56px); display: flex; align-items: center; justify-content: space-between; box-shadow: 0 3px 10px rgba(15, 23, 42, 0.14); }
        .header h1 { font-size: 1.6rem; font-weight: 700; }
        .container { width: 100%; max-width: 1600px; margin: 0 auto; padding: 28px clamp(18px, 3vw, 40px); }
        .card { background: white; border: 1px solid #e2e8f0; border-radius: 14px; padding: 22px 24px; box-shadow: 0 5px 18px rgba(15, 23, 42, 0.05); margin-bottom: 22px; }
        .card h2 { font-size: 1.15rem; color: #1e3a8a; margin-bottom: 16px; border-bottom: 2px solid #eff6ff; padding-bottom: 6px; }
        .filter-bar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 15px; }
        .filter-bar label { font-weight: 700; color: #1e3a8a; }
        .filter-bar input[type="date"] { border: 2px solid #bfdbfe; border-radius: 8px; padding: 8px 12px; font-size: 0.95rem; outline: none; }
        .btn { padding: 9px 20px; border: none; border-radius: 8px; font-size: 0.95rem; font-weight: 700; cursor: pointer; transition: all 0.2s; }
        .btn-primary { background: #2563eb; color: white; }
        .btn-primary:hover { background: #1e3a8a; }
        .btn-danger { background: #c62828; color: white; padding: 5px 12px; font-size: 0.82rem; border-radius: 6px; }
        table { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
        thead th { background: #eff6ff; padding: 10px 12px; text-align: left; font-weight: 700; color: #2563eb; text-transform: uppercase; font-size: 0.82rem; }
        tbody tr { border-bottom: 1px solid #f0f0f0; }
        tbody tr:hover { background: #f8fafc; }
        tbody td { padding: 10px 12px; }
        .status-bar { background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 10px; padding: 12px 18px; font-size: 0.9rem; color: #2563eb; }
            @media (max-width: 700px) { .header { padding: 18px; } .container { padding: 18px 12px; } .card { padding: 16px 12px; overflow-x: auto; } table { min-width: 760px; } }
    </style>
</head>
<body>

<div class="header">
    <div>
        <h1>Meal History</h1>
        <p>Review and manage meals saved to your nutrition log.</p>
    </div>
</div>

<div class="container">
    <div class="card">
        <h2>🔍 Filter Historical Logs</h2>
        <div class="filter-bar">
            <label for="historyDate">Select Date:</label>
            <input type="date" id="historyDate" />
            <button class="btn btn-primary" onclick="loadHistory()">Filter Meals</button>
            <button class="btn btn-primary" style="background:#2563eb;" onclick="loadToday()">Today</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Meal ID</th>
                    <th>Date & Time</th>
                    <th>Meal Name</th>
                    <th>Total Calories</th>
                    <th>Protein</th>
                    <th>Carbs</th>
                    <th>Fats</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="historyBody">
                <tr><td colspan="8" style="text-align:center; padding:25px; color:#9e9e9e;">Loading records from MySQL...</td></tr>
            </tbody>
        </table>
    </div>

    <div class="status-bar" id="statusBar">
        ✅ Ready. Connected to MySQL database via JDBC.
    </div>
</div>

<script>
    function getLocalDateString() {
        const today = new Date();
        today.setMinutes(today.getMinutes() - today.getTimezoneOffset());
        return today.toISOString().slice(0, 10);
    }

    window.onload = function () {
        document.getElementById('historyDate').value = getLocalDateString();
        loadHistory();
    };

    async function loadHistory() {
        const d = document.getElementById('historyDate').value;
        try {
            const response = await fetch(`/api/history?date=${encodeURIComponent(d)}`);
            if (!response.ok) throw new Error('Could not load saved meals.');
            const data = await response.json();
            render(data.meals || []);
            document.getElementById('statusBar').textContent = `Loaded ${data.meals.length} saved meal(s) for ${data.date}.`;
        } catch (error) {
            document.getElementById('historyBody').innerHTML = `<tr><td colspan="8" style="text-align:center; padding:25px; color:#c62828;">${error.message} Start NutriTrackServer and check MySQL.</td></tr>`;
        }
    }

    function loadToday() {
        document.getElementById('historyDate').value = getLocalDateString();
        loadHistory();
    }

    function render(data) {
        const tbody = document.getElementById('historyBody');
        if (data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="8" style="text-align:center; padding:25px; color:#9e9e9e;">No historical records found for this date.</td></tr>';
            return;
        }

        tbody.innerHTML = data.map(m => `
            <tr>
                <td><strong>#${m.id}</strong></td>
                <td>${m.date} <small style="color:#757575;">${m.time}</small></td>
                <td><strong style="color:#1e3a8a;">🍱 ${m.name}</strong></td>
                <td><strong style="color:#2563eb;">${m.cal.toFixed(1)} kcal</strong></td>
                <td>${m.p.toFixed(1)} g</td>
                <td>${m.c.toFixed(1)} g</td>
                <td>${m.f.toFixed(1)} g</td>
                <td><button class="btn btn-danger" onclick="deleteMeal(${m.id})">Delete</button></td>
            </tr>
        `).join('');

    }

    async function deleteMeal(id) {
        if (!confirm(`Delete Meal #${id} from MySQL?`)) return;
        try {
            const response = await fetch(`/api/history?id=${id}`, { method: 'DELETE' });
            if (!response.ok) throw new Error('Could not delete meal.');
            loadHistory();
            window.parent.postMessage({ type: 'meal-saved' }, window.location.origin);
        } catch (error) {
            document.getElementById('statusBar').textContent = error.message;
        }
    }
</script>
</body>
</html>
