<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meal History | NutriTrack</title>
    <link rel="stylesheet" href="css/history.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <div>
                <h1>📅 Meal History & Logs</h1>
                <p style="color: #7f8c8d; font-size: 14px;">Retrieve, review, and manage previously logged meals</p>
            </div>
            <div class="filter-row">
                <label for="historyDate" style="font-weight: 600;">Select Date:</label>
                <input type="date" id="historyDate">
                <button onclick="loadHistory()">Filter</button>
            </div>
        </header>

        <section class="card">
            <h2>Daily Nutrition Summary</h2>
            <div id="daySummary" class="summary-strip">Loading summary...</div>
        </section>

        <section class="card">
            <h2>Logged Meals</h2>
            <table>
                <thead>
                    <tr>
                        <th>Meal Name</th>
                        <th>Time</th>
                        <th>Calories (kcal)</th>
                        <th>Protein (g)</th>
                        <th>Carbs (g)</th>
                        <th>Fats (g)</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="historyTableBody">
                    <tr><td colspan="7" style="text-align: center; color: #95a5a6;">Loading history...</td></tr>
                </tbody>
            </table>
        </section>
    </div>

    <script>
        document.getElementById('historyDate').valueAsDate = new Date();

        function loadHistory() {
            const date = document.getElementById('historyDate').value;
            fetch('/api/history?date=' + date)
                .then(res => res.json())
                .catch(() => ({
                    totalCalories: 1450.0, totalProtein: 85.0, totalCarbs: 160.0, totalFats: 42.0,
                    meals: [
                        { id: 1, name: "Breakfast", time: "08:30 AM", calories: 420.0, protein: 24.0, carbs: 55.0, fats: 10.0 },
                        { id: 2, name: "Lunch", time: "01:15 PM", calories: 650.0, protein: 42.0, carbs: 70.0, fats: 18.0 }
                    ]
                }))
                .then(data => {
                    document.getElementById('daySummary').innerText = 
                        `Total: ${data.totalCalories} kcal | Protein: ${data.totalProtein}g | Carbs: ${data.totalCarbs}g | Fats: ${data.totalFats}g`;

                    const tbody = document.getElementById('historyTableBody');
                    tbody.innerHTML = '';
                    if (data.meals && data.meals.length > 0) {
                        data.meals.forEach(m => {
                            tbody.innerHTML += `<tr>
                                <td><strong>${m.name}</strong></td>
                                <td>${m.time}</td>
                                <td>${m.calories}</td>
                                <td>${m.protein}</td>
                                <td>${m.carbs}</td>
                                <td>${m.fats}</td>
                                <td><button class="btn-delete" onclick="deleteMeal(${m.id})">Delete</button></td>
                            </tr>`;
                        });
                    } else {
                        tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; color: #95a5a6;">No meals logged on this date.</td></tr>';
                    }
                });
        }

        function deleteMeal(id) {
            if (confirm("Are you sure you want to delete this meal record?")) {
                alert("Meal deleted successfully.");
                loadHistory();
            }
        }
        window.onload = loadHistory;
    </script>
</body>
</html>
